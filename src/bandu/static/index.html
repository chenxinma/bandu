<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>伴读 bandu · 语音轮次对话</title>
    <style>
      :root {
        --bg: #0f1220;
        --card: #191d31;
        --line: #2a3050;
        --text: #eef1ff;
        --muted: #98a0c0;
        --user: #2f6feb;
        --bot: #23304d;
        --ok: #37d39b;
        --warn: #ffb454;
        --err: #ff6b6b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 50% -10%, #1b2140, var(--bg));
        color: var(--text);
        font: 16px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 100vh;
      }
      header h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 1px;
      }
      .sub {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .badge {
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        font-size: 14px;
        white-space: nowrap;
      }
      .badge[data-phase="listening"] {
        border-color: var(--ok);
        color: var(--ok);
      }
      .badge[data-phase="thinking"] {
        border-color: var(--warn);
        color: var(--warn);
      }
      .badge[data-phase="speaking"] {
        border-color: var(--user);
        color: #9dc0ff;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      #transcript {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 4px 2px;
        min-height: 240px;
        max-height: 58vh;
      }
      .bubble {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 16px;
        background: var(--bot);
        border: 1px solid var(--line);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble.user {
        align-self: flex-end;
        background: var(--user);
        border-color: transparent;
      }
      .bubble.system {
        align-self: center;
        background: transparent;
        border-style: dashed;
        color: var(--muted);
        font-size: 14px;
      }
      .bubble.error {
        align-self: center;
        border-color: var(--err);
        color: var(--err);
      }
      .meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .meter {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .level {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .level i {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--ok), var(--warn));
        transition: width 60ms linear;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        flex: 1;
        min-width: 120px;
        padding: 14px 18px;
        font-size: 16px;
        font-family: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--user);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--user);
        border-color: transparent;
        font-weight: 600;
      }
      #hint {
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>伴读 bandu</h1>
        <p class="sub">语音轮次对话：你说完一句 → 伴读答一句。它说话时不听你说，想插话点「跳过回答」。</p>
      </header>

      <section class="bar">
        <span id="phase" class="badge" data-phase="idle">未连接</span>
        <span id="session" class="muted"></span>
      </section>

      <section id="transcript" aria-live="polite"></section>

      <section class="meter">
        <div class="level"><i id="level"></i></div>
        <span id="vad" class="muted">底噪 — · 阈值 —</span>
      </section>

      <section class="controls">
        <button id="toggle" class="primary">开始对话</button>
        <button id="done" disabled>说完了</button>
        <button id="skip" disabled>跳过回答</button>
      </section>

      <p id="hint" class="muted">
        麦克风需要安全上下文：用 http://localhost（或 127.0.0.1）打开本页，或走 https。
      </p>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
