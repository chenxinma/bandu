[project]
name = "bandu"
version = "0.1.0"
description = "伴读 bandu：面向中小学生的语音陪伴型学习助手（S1 DEMO）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[openai]",    # 教学 Agent（OpenAI 兼容协议，指向 Token Plan）
    "pydantic-ai-harness[coder]",  # 运行时能力库（Memory/Guardrails/SpendLimits 等）
    "fastapi>=0.165",              # WS 服务后端
    "uvicorn[standard]>=0.54",     # ASGI 服务器
    "requests",                    # 整段 ASR 的 HTTP 调用
    "websockets",                  # 流式 TTS（DashScope WS 任务协议）
]

[project.scripts]
bandu = "bandu:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "httpx>=0.28",  # FastAPI TestClient（WS 协议集成测试）
]

[tool.ruff]
line-length = 100
target-version = "py313"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
